name: My Python application deployment

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/myapp.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/testapp
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build, push and deploy image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Copy deploy script to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_INSTANCE_IP }}
          username: ${{ vars.EC2_INSTANCE_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: app/deploy/docker-deploy.sh
          target: /tmp/todo-deploy
          strip_components: 2

      # docker-deploy.sh installs Docker if missing, health-checks the new
      # container and rolls back to the previous image on failure.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_INSTANCE_IP }}
          username: ${{ vars.EC2_INSTANCE_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            sudo IMAGE=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} bash /tmp/todo-deploy/docker-deploy.sh
