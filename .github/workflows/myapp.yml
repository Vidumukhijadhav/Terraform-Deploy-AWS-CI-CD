name: My Python application deployment

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/myapp.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/testapp
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build, push and deploy image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_INSTANCE_IP }}
          username: ${{ vars.EC2_INSTANCE_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            docker stop todo-app || true
            docker rm todo-app || true
            docker run -d --name todo-app --restart unless-stopped \
              -p 80:8080 -v todo-data:/data \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
