name: Terraform-AWS-Deploy

on:
  push:
    paths:
      - 'env/dev/**'
      - '.github/workflows/terraform-aws-deploy.yaml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        options:
          - apply
          - destroy
        default: apply
        required: true

permissions:
  contents: read

jobs:
  tfsec:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install tfsec
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL \
            https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh \
            | bash -s -- -b /usr/local/bin

      - name: Run tfsec (SARIF)
        shell: bash
        run: |
          set -euo pipefail
          TFVARS_ARGS=()
          if [ -f env/dev/terraform.tfvars ]; then
            TFVARS_ARGS=(--tfvars-file env/dev/terraform.tfvars)
          fi
          tfsec env/dev \
            "${TFVARS_ARGS[@]}" \
            --concise-output \
            --format sarif \
            --out tfsec.sarif \
            --soft-fail
          test -s tfsec.sarif

      - name: Upload tfsec SARIF File (Security tab)
        if: always() && hashFiles('tfsec.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tfsec.sarif

      - name: Upload tfsec report as artifact (downloadable)
        if: always() && hashFiles('tfsec.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-report
          path: tfsec.sarif
          retention-days: 14

      - name: Show tfsec results in job summary
        if: always()
        shell: bash
        run: |
          TFVARS_ARGS=()
          if [ -f env/dev/terraform.tfvars ]; then
            TFVARS_ARGS=(--tfvars-file env/dev/terraform.tfvars)
          fi
          {
            echo '### tfsec results'
            echo '```'
            tfsec env/dev "${TFVARS_ARGS[@]}" --no-colour --soft-fail || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    needs: tfsec
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    concurrency:
      group: terraform-env-dev
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::636710162452:role/GitHubActionsDeployRoleV2
          aws-region: us-west-2
          role-session-name: GitHubActionsTerraform

      - name: Terraform Init
        run: terraform -chdir=env/dev init -input=false -reconfigure

      - name: Terraform Format Check
        run: terraform -chdir=env/dev fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir=env/dev validate

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Plan
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: terraform -chdir=env/dev plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.action == 'apply')
        run: terraform -chdir=env/dev apply -input=false -auto-approve tfplan

      - name: Terraform Plan Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' && github.ref == 'refs/heads/main'
        run: terraform -chdir=env/dev plan -destroy -input=false -out=tfplan-destroy

      - name: Terraform Destroy
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform -chdir=env/dev apply -input=false -auto-approve tfplan-destroy
