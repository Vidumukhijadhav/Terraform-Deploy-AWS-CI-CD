name: Terraform-AWS-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        options:
          - apply
          - destroy
        default: apply

permissions:
  contents: read
  id-token: write

jobs:
  tfsec:
    name: tfsec code security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up tfsec
        uses: aquasecurity/tfsec-action@v1
        with:
          working_directory: env/dev
          additional_args: >
            --concise-output
            --format sarif
            --out tfsec.sarif
            --soft-fail-severities LOW,MEDIUM

      - name: Upload tfsec SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif

  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: terraform-env-dev
      cancel-in-progress: true
    env:
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::636710162452:role/GitHubActionsDeployRoleV2
          aws-region: us-west-2
          role-session-name: GitHubActionsTerraform

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Clean stale local Terraform files
        run: |
          echo "Local state files found in checkout (should be empty):"
          ls -laR env/dev/.terraform env/dev/terraform.tfstate* 2>&1 || true
          rm -rf env/dev/.terraform \
                 env/dev/terraform.tfstate \
                 env/dev/terraform.tfstate.backup \
                 env/dev/terraform.tfstate.d

      - name: Terraform Init
        timeout-minutes: 5
        run: terraform -chdir=env/dev init -input=false -reconfigure

      - name: Terraform Validate
        run: terraform -chdir=env/dev validate

      - name: Terraform Plan
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: terraform -chdir=env/dev plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.action == 'apply')
        run: terraform -chdir=env/dev apply -input=false -auto-approve tfplan

      - name: Terraform Plan Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform -chdir=env/dev plan -destroy -input=false -out=tfplan-destroy

      - name: Terraform Destroy
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform -chdir=env/dev apply -input=false -auto-approve tfplan-destroy
