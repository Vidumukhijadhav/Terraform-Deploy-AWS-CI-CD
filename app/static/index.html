<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskflow · Todo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow" id="today"></p>
        <h1>Taskflow</h1>
        <p class="subtitle" id="greeting">Let's get things done.</p>
      </div>
      <div class="header-right">
        <div class="progress" title="Completion">
          <svg viewBox="0 0 120 120">
            <circle class="track" cx="60" cy="60" r="52" />
            <circle class="bar" id="progress-bar" cx="60" cy="60" r="52" />
          </svg>
          <span id="progress-text">0%</span>
        </div>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          <span class="sun">☀️</span><span class="moon">🌙</span>
        </button>
      </div>
    </header>

    <section class="stats">
      <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">Total</span></div>
      <div class="stat"><span class="stat-num" id="stat-active">0</span><span class="stat-label">Active</span></div>
      <div class="stat"><span class="stat-num" id="stat-done">0</span><span class="stat-label">Done</span></div>
      <div class="stat overdue"><span class="stat-num" id="stat-overdue">0</span><span class="stat-label">Overdue</span></div>
    </section>

    <form class="composer card" id="todo-form" autocomplete="off">
      <input id="todo-input" type="text" maxlength="200" placeholder="What needs to be done?" required />
      <div class="composer-row">
        <div class="priority-picker" role="radiogroup" aria-label="Priority">
          <label><input type="radio" name="priority" value="low" /><span class="chip low">Low</span></label>
          <label><input type="radio" name="priority" value="medium" checked /><span class="chip medium">Medium</span></label>
          <label><input type="radio" name="priority" value="high" /><span class="chip high">High</span></label>
        </div>
        <input id="todo-due" type="date" aria-label="Due date" />
        <button type="submit" class="btn-primary">
          <span>Add task</span>
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </form>

    <section class="toolbar">
      <div class="filters" role="tablist">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search tasks…" />
      </div>
    </section>

    <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

    <div class="empty" id="empty" hidden>
      <div class="empty-art">🌿</div>
      <h3 id="empty-title">All clear!</h3>
      <p id="empty-text">Add your first task above to get started.</p>
    </div>

    <footer class="footer">
      <span id="footer-count">0 tasks left</span>
      <button class="link-btn" id="clear-completed">Clear completed</button>
    </footer>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <template id="todo-template">
    <li class="todo">
      <label class="check">
        <input type="checkbox" />
        <span class="checkmark">
          <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </label>
      <div class="todo-body">
        <span class="todo-title" title="Double-click to edit"></span>
        <div class="todo-meta">
          <span class="chip priority"></span>
          <span class="due"></span>
        </div>
      </div>
      <button class="icon-btn delete" aria-label="Delete task" title="Delete">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </li>
  </template>

  <script src="/app.js"></script>
</body>
</html>
